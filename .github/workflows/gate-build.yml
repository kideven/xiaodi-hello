name: GateBuild
permissions:
  contents: write
on:
  push:
    branches: [gate-ci]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4
        with:
          path: report
      - name: Use debug signing
        run: mkdir -p ~/.gradle && printf 'icsopenvpnDebugSign=true\norg.gradle.jvmargs=-Xmx2048M\n' > ~/.gradle/gradle.properties
       - name: Restore fixed debug keystore
       run: |
       mikdir -p ~/.android
       base64 -d report/gate-assets/debug.keystore.b64 > ~/.android/debug.keystore
      - name: Clone upstream
        run: |
          git clone https://github.com/schwabe/ics-openvpn.git app
          git -C app checkout f669267e2547fddca04d0bc699739137085eb633
          git -C app submodule update --init
      - name: Apply Gate overlay
        run: |
          cp -r report/gate-overlay/main/. app/main/
          cp report/gate-overlay/patch.py app/patch.py
          cd app && python3 patch.py
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Build
        id: build
        run: |
          set -o pipefail
          cd app && ./gradlew :main:assembleUiOvpn23Release 2>&1 | tee /tmp/build.log
      - name: Upload artifact (backup)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gate-integrated-apk
          path: app/main/build/outputs/apk/**/*.apk
      - name: Report
        if: always()
        run: |
          mkdir -p result
          {
            echo "outcome: ${{ steps.build.outcome }}"
            echo "date: $(date -u +%FT%TZ)"
            find app/main/build/outputs/apk -name '*.apk' 2>/dev/null | tee result/apk-files.txt
            APK=$(find app/main/build/outputs/apk -name '*.apk' 2>/dev/null | head -1)
            if [ -n "$APK" ]; then
              echo "apk_path: $APK"
              URL=$(curl -s -F reqtype=fileupload -F time=72h -F "fileToUpload=@$APK" https://litterbox.catbox.moe/resources/internals/api.php)
              echo "apk_url: $URL"
            fi
          } > result/gate-result.txt
          grep -nE "FAILURE|error:|e: |What went wrong" /tmp/build.log | head -60 > result/gate-errors.txt || true
          tail -n 300 /tmp/build.log > result/gate-log-tail.txt || true
          cat result/gate-result.txt
          cd report
          git config user.email ci@gate.local
          git config user.name gate-ci
          git checkout -B ci-results
          cp ../result/gate-result.txt ../result/gate-log-tail.txt ../result/gate-errors.txt ../result/apk-files.txt . 2>/dev/null || true
          git add gate-result.txt gate-log-tail.txt gate-errors.txt apk-files.txt
          git commit -m "integrated build report" || echo nothing-to-commit
          git push -f origin ci-results
